spring:
  application:
    name: url-shortner
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: urluser
    password: admin

  jpa:
    hibernate:
      ddl: auto-update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
